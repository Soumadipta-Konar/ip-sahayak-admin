version: '3.8'

services:
  # Vector Database for Dense Embeddings
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - ip-sakti-net

  # Knowledge Graph Database
  neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/ipsakti_secret_password
    volumes:
      - neo4j_data:/data
    networks:
      - ip-sakti-net

  # Cache & Celery Broker
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - ip-sakti-net

  # Relational Database for User Profiles & Logs
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=ipsakti_user
      - POSTGRES_PASSWORD=ipsakti_secret_password
      - POSTGRES_DB=ipsakti_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ip-sakti-net

volumes:
  qdrant_data:
  neo4j_data:
  redis_data:
  postgres_data:

networks:
  ip-sakti-net:
    driver: bridge
